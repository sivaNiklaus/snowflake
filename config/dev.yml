# Lifecycle settings; connection_name must match a local Snowflake CLI profile.
environment: dev
snowflake:
  database: SKYPOINTS_DB
  warehouse: SKYPOINTS_ETL_WH
  connection_name: "<configure local Snowflake CLI connection>"
storage:
  integration: SKYPOINTS_S3_STORAGE_INT
  s3_bucket: "skypoints-etl-dev-siva-0408"
  member_prefix: "members/"
  redemption_prefix: "redemptions/"
destroy_policy:
  delete_warehouse: true
